# cargo-deny policy (docs/engineering/conventions.md, crates-and-dependencies.md section 6).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

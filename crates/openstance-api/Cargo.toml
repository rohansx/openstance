[package]
name = "openstance-api"
description = "Local HTTP API (Phase 4): routes mapped to openstance-core calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
# Embed the built web UI (`ui/dist`) into the binary. Without the feature,
# or when `ui/dist` was not built, `/` serves a short placeholder page.
ui = ["dep:rust-embed"]

[dependencies]
openstance-core.workspace = true
openstance-mcp.workspace = true
axum.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time", "fs"] }
tokio-util.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
tempfile.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true
http-body-util.workspace = true

[dev-dependencies]
openstance-core = { workspace = true, features = ["test-util"] }
openstance-enrich = { workspace = true, features = ["mock"] }
openstance-import = { workspace = true, features = ["vcf"] }
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "openstance-import"
description = "Importer and Sink traits, raw record types, and the built-in file importers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["mbox", "linkedin", "vcf"]
# Phase 1 importers. Each gates one module and its parser dependencies.
mbox = ["dep:mail-parser", "dep:memchr"]
linkedin = ["dep:csv"]
vcf = ["dep:quoted_printable"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
mail-parser = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
quoted_printable = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true

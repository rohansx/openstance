[package]
name = "openstance-import"
description = "Importer and Sink traits, raw record types, and the built-in file importers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["mbox", "linkedin", "vcf", "ics", "x-archive"]
# Phase 1 importers. Each gates one module and its parser dependencies.
mbox = ["dep:mail-parser", "dep:memchr", "dep:regex"]
linkedin = ["dep:csv", "dep:regex", "dep:zip"]
vcf = ["dep:quoted_printable", "dep:regex"]
# Phase 3 importers.
ics = ["dep:rrule"]
x-archive = ["dep:zip", "dep:serde_json"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
mail-parser = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
quoted_printable = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rrule = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true
serde_json.workspace = true
insta.workspace = true

[lints]
workspace = true

[package]
name = "openstance"
description = "openstance: a local-first relationship graph for your own contacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "openstance"

[[bin]]
name = "openstance"
path = "src/main.rs"

[[bin]]
name = "ost"
path = "src/bin/ost.rs"

[features]
default = ["importers-default", "models-local", "enrich-treg", "server", "ui"]
importers-default = [
    "openstance-import/mbox",
    "openstance-import/linkedin",
    "openstance-import/vcf",
    "openstance-import/ics",
    "openstance-import/x-archive",
]
models-local = ["openstance-model/fastembed"]
models-remote = ["openstance-model/ollama", "openstance-model/openai", "openstance-model/anthropic"]
enrich-treg = ["openstance-enrich/treg"]
server = ["dep:openstance-mcp", "dep:openstance-api"]
ui = ["server", "openstance-api/ui"]
offline = []

[dependencies]
openstance-core.workspace = true
openstance-import.workspace = true
openstance-model.workspace = true
openstance-enrich.workspace = true
openstance-mcp = { workspace = true, optional = true }
openstance-api = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
time.workspace = true
csv.workspace = true

[dev-dependencies]
openstance-core = { workspace = true, features = ["test-util"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true
rusqlite.workspace = true

[lints]
workspace = true

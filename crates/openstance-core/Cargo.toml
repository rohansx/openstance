[package]
name = "openstance-core"
description = "Schema, migrations, resolution, scoring and search for openstance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Helpers for integration tests in other crates (TestGraph and friends).
test-util = []

[dependencies]
# trait crates, traits and types only
openstance-import.workspace = true
openstance-enrich.workspace = true
openstance-model.workspace = true

rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
strsim.workspace = true
regex.workspace = true
idna.workspace = true
url.workspace = true
psl.workspace = true
phonenumber.workspace = true
blake3.workspace = true
time.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
csv.workspace = true
lru.workspace = true

[dev-dependencies]
# Integration tests import the real fixture files, so they enable the
# Phase 1 importers. This is a dev-dependency only: `cargo tree -e normal`
# for openstance-core stays free of concrete importers.
openstance-import = { workspace = true, features = ["mbox", "linkedin", "vcf"] }
tempfile.workspace = true
proptest.workspace = true
insta.workspace = true

[lints]
workspace = true

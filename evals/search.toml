# Search evaluation (P1-CORE-17, extended to 50 queries by P2-CORE-06).
#
# Run: cargo test -p openstance-core --test search_eval -- --nocapture
#
# The graph is the Phase 1 fixture set (fixtures/EXPECTED.md) imported with
# fixtures/config.toml, searched with the rules parser and no reranker at a
# fixed "now". Expectations name people by a stable handle (see [people]),
# never by row id. `expect_top5` is an order-insensitive set (may be < 5);
# `must_not` lists people that must not appear in the top 5.
#
# Tiers. A query with no `tier` runs in every tier, including the offline
# rules tier above (NullEmbedder: FTS only), which CI always runs. A query
# with `tier = "embedder"` is semantic: its phrasing shares no keyword with
# the person it should find ("bouldering" -> a "climbing" thread), so FTS
# alone cannot answer it. The rules tier skips (and lists) those queries;
# the embedder tier (`[embedder]` below, fastembed bge-small-en-v1.5, model
# cached between CI runs) runs all 50 and gates on its own thresholds. A
# third tier with a local Ollama parser/reranker is for local use only
# (docs/engineering/testing-strategy.md).
#
# Metrics: Recall@5 = mean over queries with expectations of
# |expected ∩ top5| / |expected|; MRR = mean of 1 / rank of the first
# expected person (0 when none is in the results); must_not violations =
# count over all queries. The test fails below the thresholds.

[settings]
parser = "rules"
reranker = "none"
config = "fixtures/config.toml"
now = "2026-10-20T12:00:00Z"
fixtures = [
  "fixtures/mbox/small.mbox",
  "fixtures/linkedin/Connections.csv",
  "fixtures/linkedin/messages.csv",
  "fixtures/linkedin/Invitations.csv",
  "fixtures/vcf/contacts.vcf",
]

# Baseline (2026-10, rules tier, the 40 untiered queries): Recall@5 1.000,
# MRR 1.000, 0 violations.
# Thresholds are the baseline minus the allowed drop (testing-strategy.md:
# 0.02 recall, 0.03 MRR), so a single regressed query fails the test.
[thresholds]
recall_at_5 = 0.98
mrr = 0.97
must_not_violations = 0

# Embedder tier: every query, rules parser, no reranker, fastembed embedder,
# hybrid FTS + vector fusion. Run by fixtures/gen/tests/search_eval_tiers.rs
# when OPENSTANCE_MODEL_DIR holds the model (skipped offline):
#   OPENSTANCE_MODEL_DIR=~/.openstance/models \
#     cargo test -p openstance-fixtures --test search_eval_tiers -- --nocapture
# The same file checks offline that hash:64 fusion keeps the untiered
# queries at the rules thresholds and that FTS alone answers none of the
# tier = "embedder" queries.
# Baseline (2026-10, all 50 queries, deterministic across runs): Recall@5
# 0.958, MRR 0.920, 0 violations; the untiered 40 stay at 1.000. Misses:
# q41 (0.50), q42 (0.00: investors are not found from "write checks"),
# q45 (0.50). Thresholds are the baseline minus the allowed drop (0.02
# recall, 0.03 MRR), rounded down.
[embedder]
embedder = "fastembed:bge-small-en-v1.5"
recall_at_5 = 0.93
mrr = 0.89
must_not_violations = 0


# P1-CI-02: fmt, clippy -D warnings, tests on Linux and macOS, cargo deny,
# and the dependency-direction check. P4: the web UI and the landing site
# (lint, typecheck, test, build, bundle size), and a release build with the
# UI embedded, smoke-tested with Playwright. See
# docs/engineering/ci-and-release.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests must never touch the network.
  OPENSTANCE_DENY_NETWORK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Dependency direction
        run: ./scripts/check-deps.sh
      - name: Fixtures match their generator
        run: |
          cargo run --locked -q -p openstance-fixtures --bin gen-fixtures
          git diff --exit-code -- fixtures/

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on 24.04: the prebuilt ONNX Runtime that ort 2.0.0-rc.15
        # links (fastembed, default feature models-local) is built against
        # glibc 2.38 and GCC 13's libstdc++, so it does not link on 22.04
        # (undefined __isoc23_strtol, _M_replace_cold).
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --doc
      - name: Importers build without features
        run: cargo check -p openstance-import --no-default-features --locked

  # P2-CORE-06: the 50-query search eval with the fastembed embedder
  # (parser = rules, reranker = none), gated on the [embedder] thresholds in
  # evals/search.toml. The model (about 33 MB) is downloaded once and cached
  # between runs; the eval itself runs with downloads forbidden.
  eval:
    # 24.04 for the same ONNX Runtime glibc floor as the test job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENSTANCE_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: eval
      - name: Model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .models
          key: model-fastembed-7.1.4-bge-small-en-v1.5-onnx-Q
      - name: Download the model (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: >
          cargo test --locked -p openstance-model --features fastembed
          --test conformance -- --ignored fastembed_conforms_with_the_real_model
      - name: Search eval, embedder tier (Recall@5 reported and gated)
        env:
          OPENSTANCE_OFFLINE: "1"
          OPENSTANCE_REQUIRE_MODEL: "1"
        run: cargo test --locked -p openstance-fixtures --test search_eval_tiers -- --nocapture

  # P2-CORE-07 latency gate: search benches on the 20k-person perf graph
  # (hash embedder). Fails when text search p50 > 300 ms, structured
  # search p50 > 50 ms, or either p50 is more than 20 % slower than the
  # base branch measured on the same runner.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Baseline (base branch)
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/crates/openstance-core/benches/search.rs" ]; then
            cd "$RUNNER_TEMP/base"
            # the base's own target check may fail; only its numbers matter here
            OPENSTANCE_BENCH_SAVE="$RUNNER_TEMP/base.json" \
              cargo bench --locked -p openstance-core --bench search -- --quick \
              || echo "base branch missed a latency target (comparing anyway)"
          fi
      - name: Search latency gate
        run: |
          if [ -f "$RUNNER_TEMP/base.json" ]; then export OPENSTANCE_BENCH_COMPARE="$RUNNER_TEMP/base.json"; fi
          cargo bench --locked -p openstance-core --bench search -- --quick

  # P4-UI-*: the web UI (ui/) and the landing site (site/). Vite + React +
  # TypeScript; the gzipped bundle must stay under 300 KB.
  node:
    name: node (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [ui, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size (under 300 KB gzipped)
        run: npm run size

  # P4-API-06: the release binary embeds ui/dist (feature `ui`, on by
  # default). The UI is built first; without ui/dist the binary would serve a
  # placeholder page. Then the Playwright smoke tests run against it
  # (offline, fictional demo dataset).
  ui-release:
    name: release build with embedded UI
    # 24.04 for the ONNX Runtime glibc floor (see the test job).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-release
      - name: Build the web UI
        working-directory: ui
        run: npm ci && npm run build
      - run: cargo build --release --locked -p openstance
      - name: The binary serves the embedded UI, not the placeholder
        env:
          OPENSTANCE_HOME: ${{ runner.temp }}/home
          OPENSTANCE_OFFLINE: "1"
          OPENSTANCE__MODEL__EMBEDDER: none
        run: |
          bin=target/release/openstance
          "$bin" init
          "$bin" serve --port 0 --json > "$RUNNER_TEMP/ready.json" &
          for _ in $(seq 100); do [ -s "$RUNNER_TEMP/ready.json" ] && break; sleep 0.1; done
          base=$(jq -r .api "$RUNNER_TEMP/ready.json")
          curl -sf "$base/" > "$RUNNER_TEMP/index.html"
          grep -q 'assets/index-' "$RUNNER_TEMP/index.html"
          if grep -q 'npm run build' "$RUNNER_TEMP/index.html"; then echo "placeholder page served"; exit 1; fi
          kill %1
      - name: Playwright smoke tests
        working-directory: ui
        env:
          OPENSTANCE_BIN: ${{ github.workspace }}/target/release/openstance
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
